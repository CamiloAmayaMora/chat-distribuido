    <style>
      :root {
        --ground: #0c1016;
        --panel: #151b24;
        --panel2: #1c2430;
        --line: #2a3442;
        --ink: #eef2f7;
        --muted: #8b97a8;
        --ga: #ff5d84;
        --gb: #5aa9ff;
        --gc: #b98cff;
        --gd: #f5b748;
        --ok: #34c3a9;
        --warn: #f5b748;
        --bad: #ff5c5c;
        --central: #eef2f7;
        --font-display: "Outfit", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-body); color: var(--ink); }
      #bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px 700px at 78% 18%, rgba(255, 93, 132, 0.10), transparent 60%),
          radial-gradient(1000px 700px at 12% 92%, rgba(90, 169, 255, 0.09), transparent 60%),
          var(--ground);
      }
      /* piezas compartidas por todas las escenas */
      .node {
        position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 28px; background: var(--panel); border: 3px solid var(--line);
        font-family: var(--font-display); font-weight: 600; color: var(--ink);
      }
      .node small { font-family: var(--font-body); font-weight: 500; font-size: 28px; color: var(--muted); margin-top: 4px; }
      .chip {
        position: absolute; display: inline-flex; align-items: center; gap: 12px; white-space: nowrap;
        padding: 12px 22px; border-radius: 999px; background: var(--panel2); border: 2px solid var(--line);
        font-family: var(--font-mono); font-size: 28px; color: var(--ink);
      }
      .bubble {
        position: absolute; padding: 14px 22px; border-radius: 20px; background: var(--panel2); white-space: nowrap;
        font-family: var(--font-body); font-size: 28px; font-weight: 500; color: var(--ink); border: 2px solid var(--line);
      }
      .kicker { position: absolute; font-family: var(--font-mono); font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
      .title { position: absolute; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; color: var(--ink); }
      .mono { font-family: var(--font-mono); }
      .wire { position: absolute; height: 4px; background: var(--line); transform-origin: 0 50%; border-radius: 2px; }
    </style>
  </head>
