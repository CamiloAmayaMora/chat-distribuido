<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Demo · chat distribuido</title>
<style>
  :root { --ground:#0c1016; --panel:#151b24; --line:#2a3442; --ink:#eef2f7; --muted:#8b97a8;
          --ga:#ff5d84; --gb:#5aa9ff; --ok:#34c3a9; --warn:#f5b748; --bad:#ff5c5c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--ink);
               font-family: "Segoe UI", Inter, sans-serif; }
  header { position: absolute; left: 40px; right: 40px; top: 24px; height: 76px; display: flex; align-items: center; gap: 22px; }
  .live { white-space: nowrap; font-family: Consolas, monospace; font-size: 22px; letter-spacing: .14em; color: var(--bad); border: 2px solid var(--bad);
          border-radius: 999px; padding: 6px 16px; }
  #step { font-size: 36px; font-weight: 650; white-space: nowrap; }
  #step b { color: var(--warn); font-weight: 650; }
  .spacer { flex: 1; }
  #cmd { font-family: Consolas, monospace; font-size: 24px; color: var(--ok); background: #0a0d12; border: 2px solid var(--line);
         border-radius: 14px; padding: 10px 18px; opacity: 0; transition: opacity .25s; max-width: 900px; white-space: nowrap; overflow: hidden; }
  #cmd.on { opacity: 1; }
  .col { position: absolute; top: 118px; width: 912px; height: 600px; }
  #colA { left: 40px; } #colB { left: 968px; }
  .lab { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 12px;
         font-size: 26px; font-weight: 650; }
  .lab .dot { width: 16px; height: 16px; border-radius: 50%; }
  .lab small { font-family: Consolas, monospace; font-size: 20px; color: var(--muted); font-weight: 400; }
  iframe { position: absolute; top: 50px; left: 0; width: 684px; height: 412px; transform: scale(1.3333); transform-origin: 0 0; border: 3px solid var(--line); border-radius: 18px; background: #fff; }
  #colA iframe { border-color: var(--ga); } #colB iframe { border-color: var(--gb); }
  .down iframe { filter: grayscale(1) brightness(.55); }
  .off { position: absolute; top: 260px; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 700; color: var(--bad);
         opacity: 0; transition: opacity .25s; text-shadow: 0 2px 20px #000; }
  .down .off { opacity: 1; }
  #logs { position: absolute; left: 40px; right: 40px; top: 742px; bottom: 30px; background: #0a0d12; border: 2px solid var(--line);
          border-radius: 18px; padding: 16px 22px; overflow: hidden; font-family: Consolas, monospace; font-size: 23px; line-height: 1.5; }
  #logs .h { color: var(--muted); font-size: 18px; letter-spacing: .14em; margin-bottom: 6px; }
  #lines { position: absolute; left: 22px; right: 22px; bottom: 14px; }
  .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ln .s-ga { color: var(--ga); font-weight: 700; } .ln .s-gb { color: var(--gb); font-weight: 700; }
  .ln .k { font-weight: 700; } .ln .m { color: var(--muted); }
  .k.ok { color: var(--ok); } .k.warn { color: var(--warn); } .k.bad { color: var(--bad); } .k.info { color: var(--ink); }
  .ln.fresh { background: rgba(245,183,72,.10); }
</style>
</head>
<body>
  <header>
    <span class="live">DEMO REAL</span>
    <span id="step">Preparando…</span>
    <span class="spacer"></span>
    <span id="cmd"></span>
  </header>
  <div class="col" id="colA">
    <div class="lab"><span class="dot" style="background:var(--ga)"></span>Grupo ga <small>localhost:8001 · usuaria ana</small></div>
    <iframe id="fa" src="http://localhost:8001/"></iframe>
    <div class="off">ga APAGADO</div>
  </div>
  <div class="col" id="colB">
    <div class="lab"><span class="dot" style="background:var(--gb)"></span>Grupo gb <small>localhost:8002 · usuario beto</small></div>
    <iframe id="fb" src="http://localhost:8002/"></iframe>
    <div class="off">gb APAGADO</div>
  </div>
  <div id="logs"><div class="h">LOGS DE LOS SERVIDORES (docker logs -f)</div><div id="lines"></div></div>
<script>
  const KIND = { SENT:"ok", RECEIVED:"ok", RECOVERED:"ok", HISTORY_DONE:"ok", CENTRAL_UP:"ok", REGISTERED:"ok", OUTBOX_FLUSH:"ok",
                 DUPLICATE:"warn", RETRY:"warn", HISTORY_REQUEST:"warn", HEARTBEAT_FAIL:"bad", CENTRAL_DOWN:"bad",
                 REJECTED:"bad", CENTRAL_BLIP:"warn", LOCAL_MESSAGE:"info", STARTUP:"info", USER_CREATED:"info" };
  window.addLog = (srv, kind, rest) => {
    const box = document.getElementById("lines");
    box.querySelectorAll(".fresh").forEach(e => e.classList.remove("fresh"));
    const d = document.createElement("div");
    d.className = "ln fresh";
    const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
    d.innerHTML = `<span class="s-${srv}">${srv}</span> <span class="k ${KIND[kind] || "info"}">${kind.padEnd(15, " ").replace(/ /g, "&nbsp;")}</span> <span class="m">${esc(rest)}</span>`;
    box.appendChild(d);
    while (box.children.length > 7) box.removeChild(box.firstChild);
  };
  window.setStep = (html, cmd) => {
    document.getElementById("step").innerHTML = html;
    const c = document.getElementById("cmd");
    if (cmd) { c.textContent = "$ " + cmd; c.classList.add("on"); } else { c.classList.remove("on"); }
  };
  window.setDown = (id, on) => document.getElementById(id).classList.toggle("down", on);
</script>
</body>
</html>
