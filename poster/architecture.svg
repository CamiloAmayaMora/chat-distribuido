<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b1427"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Central -->
  <rect x="330" y="20" width="340" height="110" rx="10" fill="#5b1427"/>
  <text x="500" y="50" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Servidor central (profesor)</text>
  <text x="500" y="74" text-anchor="middle" fill="#f3dfe4" font-size="13">registro de servidores · historial de #general</text>
  <text x="500" y="94" text-anchor="middle" fill="#f3dfe4" font-size="13">reenvío a todos menos al origen</text>
  <text x="500" y="114" text-anchor="middle" fill="#f3dfe4" font-size="13">CENTRAL_URL (variable de entorno)</text>

  <!-- Otros grupos -->
  <rect x="40" y="40" width="150" height="70" rx="8" fill="#f7eef0" stroke="#c99aa6" stroke-dasharray="5 4"/>
  <text x="115" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#5b1427">otros grupos</text>
  <text x="115" y="92" text-anchor="middle" font-size="12" fill="#6b6560">g1, g2, g4, …</text>
  <line x1="190" y1="75" x2="328" y2="75" stroke="#5b1427" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="810" y="40" width="150" height="70" rx="8" fill="#f7eef0" stroke="#c99aa6" stroke-dasharray="5 4"/>
  <text x="885" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#5b1427">otros grupos</text>
  <text x="885" y="92" text-anchor="middle" font-size="12" fill="#6b6560">no se hablan entre sí</text>
  <line x1="672" y1="75" x2="808" y2="75" stroke="#5b1427" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Flechas grupo -> central -->
  <line x1="430" y1="132" x2="430" y2="246" stroke="#5b1427" stroke-width="2.5" marker-end="url(#a)" transform="rotate(180 430 189)"/>
  <text x="420" y="160" text-anchor="end" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">POST /register  (cada 15 s)</text>
  <text x="420" y="178" text-anchor="end" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">POST /messages  (outbox + backoff)</text>
  <text x="420" y="196" text-anchor="end" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">GET /history?since=L</text>
  <text x="420" y="214" text-anchor="end" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">GET /health  (heartbeat)</text>
  <text x="420" y="236" text-anchor="end" font-size="11.5" fill="#6b6560">grupo → central</text>

  <line x1="570" y1="132" x2="570" y2="246" stroke="#5b1427" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="580" y="178" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">POST /fed/messages</text>
  <text x="580" y="196" font-size="12.5" fill="#5b1427" font-family="Consolas, monospace">GET /fed/health</text>
  <text x="580" y="236" font-size="11.5" fill="#6b6560">central → grupo (PUBLIC_URL)</text>

  <!-- Host del grupo -->
  <rect x="150" y="250" width="700" height="360" rx="14" fill="#faf8f6" stroke="#5b1427" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="170" y="276" font-size="14" font-weight="700" fill="#5b1427">Portátil del grupo · docker compose up  (red "chat")</text>

  <!-- Contenedor server -->
  <rect x="300" y="295" width="400" height="190" rx="10" fill="#ffffff" stroke="#7a1c34" stroke-width="2"/>
  <rect x="300" y="295" width="400" height="32" rx="10" fill="#7a1c34"/>
  <rect x="300" y="315" width="400" height="12" fill="#7a1c34"/>
  <text x="500" y="317" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">contenedor server · Python 3.12 + FastAPI · :8000</text>
  <rect x="315" y="338" width="180" height="60" rx="6" fill="#f3e6ea"/>
  <text x="405" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#5b1427">API de federación</text>
  <text x="405" y="379" text-anchor="middle" font-size="11.5" fill="#333" font-family="Consolas, monospace">/fed/health  /fed/messages</text>
  <text x="405" y="393" text-anchor="middle" font-size="11" fill="#6b6560">dedup por id · Lamport</text>
  <rect x="505" y="338" width="180" height="60" rx="6" fill="#e7eef6"/>
  <text x="595" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5d8a">API de cliente (libre)</text>
  <text x="595" y="379" text-anchor="middle" font-size="11.5" fill="#333" font-family="Consolas, monospace">/api/users /api/messages</text>
  <text x="595" y="393" text-anchor="middle" font-size="11" fill="#6b6560">/api/status · página web /</text>
  <rect x="315" y="408" width="370" height="66" rx="6" fill="#f5f2ee"/>
  <text x="500" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Tareas de fondo (asyncio)</text>
  <text x="500" y="447" text-anchor="middle" font-size="11.5" fill="#333">register_loop · heartbeat_loop (N fallos ⇒ caído)</text>
  <text x="500" y="464" text-anchor="middle" font-size="11.5" fill="#333">outbox_loop (reintentos 1,2,4…30 s) · recover_history</text>

  <!-- Volumen -->
  <path d="M330 520 a170 14 0 0 0 340 0 v60 a170 14 0 0 1 -340 0 z" fill="#a11a3f"/>
  <ellipse cx="500" cy="520" rx="170" ry="14" fill="#c4385d"/>
  <text x="500" y="552" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">volumen chat-data → /data/chat.db (SQLite, WAL)</text>
  <text x="500" y="572" text-anchor="middle" fill="#fbe3ea" font-size="12">users · messages · outbox · state(lamport) · events.jsonl</text>
  <line x1="500" y1="486" x2="500" y2="504" stroke="#a11a3f" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Clientes -->
  <rect x="170" y="330" width="105" height="56" rx="8" fill="#e7eef6" stroke="#2f5d8a"/>
  <text x="222" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5d8a">navegador</text>
  <text x="222" y="372" text-anchor="middle" font-size="11" fill="#333">index.html</text>
  <rect x="170" y="410" width="105" height="56" rx="8" fill="#e7eef6" stroke="#2f5d8a"/>
  <text x="222" y="434" text-anchor="middle" font-size="13" font-weight="600" fill="#2f5d8a">consola</text>
  <text x="222" y="452" text-anchor="middle" font-size="11" fill="#333">client/cli.py</text>
  <line x1="276" y1="358" x2="298" y2="358" stroke="#2f5d8a" stroke-width="2" marker-end="url(#b)"/>
  <line x1="276" y1="438" x2="298" y2="410" stroke="#2f5d8a" stroke-width="2" marker-end="url(#b)"/>

  <!-- Puertos / env -->
  <rect x="720" y="300" width="115" height="180" rx="8" fill="#fff" stroke="#d9d2cb"/>
  <text x="777" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#333">Configuración</text>
  <text x="730" y="345" font-size="11" fill="#333" font-family="Consolas, monospace">GROUP_NAME</text>
  <text x="730" y="363" font-size="11" fill="#333" font-family="Consolas, monospace">PUBLIC_URL</text>
  <text x="730" y="381" font-size="11" fill="#333" font-family="Consolas, monospace">CENTRAL_URL</text>
  <text x="730" y="399" font-size="11" fill="#333" font-family="Consolas, monospace">HEARTBEAT_*</text>
  <text x="730" y="417" font-size="11" fill="#333" font-family="Consolas, monospace">RETRY_*</text>
  <text x="730" y="435" font-size="11" fill="#333" font-family="Consolas, monospace">HISTORY_*</text>
  <text x="777" y="462" text-anchor="middle" font-size="11" fill="#6b6560">archivo .env</text>
  <text x="777" y="560" text-anchor="middle" font-size="12" fill="#6b6560">puerto host</text>
  <text x="777" y="578" text-anchor="middle" font-size="12" fill="#6b6560" font-family="Consolas, monospace">HOST_PORT → 8000</text>
</svg>
