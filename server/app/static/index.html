<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#general · chat distribuido</title>
<style>
  :root {
    --bg: #f6f4f1; --panel: #ffffff; --ink: #1d1b19; --muted: #6b6560;
    --line: #e4dfd9; --accent: #7a1c34; --ok: #2f7d4f; --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--accent); color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .srv { opacity: .85; font-family: ui-monospace, Consolas, monospace; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.18); font-family: ui-monospace, Consolas, monospace; }
  .pill.up::before, .pill.down::before { content: "●"; margin-right: 5px; }
  .pill.up::before { color: #8fe3ad; } .pill.down::before { color: #ff9a8f; }
  .spacer { flex: 1; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; height: calc(100vh - 56px); grid-template-rows: auto 1fr auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #login { padding: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  input { background: #fff; color: var(--ink); }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #feed { overflow-y: auto; padding: 8px 12px; }
  .msg { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .msg:last-child { border-bottom: 0; }
  .lam { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); text-align: right; padding-top: 2px; }
  .who { font-weight: 650; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; font-weight: 600; vertical-align: 1px; }
  .tag.local { background: #e8f3ec; color: var(--ok); }
  .tag.remote { color: #fff; }
  .msg.remote { border-left: 4px solid var(--c); padding-left: 8px; }
  .msg.local { border-left: 4px solid transparent; padding-left: 8px; }
  .meta { font-size: 12px; color: var(--muted); }
  .body { white-space: pre-wrap; word-break: break-word; }
  #composer { padding: 10px; display: flex; gap: 8px; }
  #composer input { flex: 1; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>#general</h1>
  <span class="srv" id="srv">servidor …</span>
  <span class="spacer"></span>
  <span class="pill" id="central">central …</span>
  <span class="pill" id="lamport">lamport …</span>
  <span class="pill" id="outbox">pendientes …</span>
</header>

<main>
  <div class="card" id="login">
    <label for="user">Usuario:</label>
    <input id="user" placeholder="ana" maxlength="32" autocomplete="off">
    <button id="enter">Entrar / crear</button>
    <span id="me" class="meta"></span>
    <span id="err" class="err"></span>
  </div>

  <div class="card" id="feed"><div class="empty">Cargando historial…</div></div>

  <form class="card" id="composer">
    <input id="text" placeholder="Escribe un mensaje para todo el curso…" maxlength="2000" autocomplete="off" disabled>
    <button id="send" disabled>Enviar</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
let me = localStorage.getItem("chat_user") || null;
let myServer = null;
let lastSig = "";

// Color estable por servidor de origen: los usuarios de otros grupos se distinguen visualmente.
function colorFor(origin) {
  let h = 0;
  for (const ch of origin) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 42%)`;
}
function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function login() {
  $("err").textContent = "";
  const name = $("user").value.trim().toLowerCase();
  if (!name) return;
  try {
    const res = await api("/api/users", { method: "POST", body: JSON.stringify({ name }) });
    me = res.user;
    localStorage.setItem("chat_user", me);
    showMe();
  } catch (e) { $("err").textContent = e.message; }
}

function showMe() {
  $("me").textContent = me ? `Conectado como ${me}` : "";
  $("text").disabled = !me; $("send").disabled = !me;
  if (me) { $("user").value = me.split("@")[0]; $("text").focus(); }
}

async function send(ev) {
  ev.preventDefault();
  const body = $("text").value.trim();
  if (!body || !me) return;
  $("text").value = "";
  try {
    await api("/api/messages", { method: "POST", body: JSON.stringify({ user: me, body }) });
    refresh();
  } catch (e) { $("err").textContent = e.message; }
}

function render(msgs) {
  const sig = msgs.length + ":" + (msgs.length ? msgs[msgs.length - 1].id : "");
  if (sig === lastSig) return;
  lastSig = sig;
  const feed = $("feed");
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  if (!msgs.length) { feed.innerHTML = '<div class="empty">Aún no hay mensajes en #general.</div>'; return; }
  feed.innerHTML = msgs.map((m) => {
    const local = m.origin === myServer;
    const c = colorFor(m.origin);
    const tag = local
      ? `<span class="tag local">mi grupo</span>`
      : `<span class="tag remote" style="background:${c}">${esc(m.origin)}</span>`;
    const time = m.sent_at ? new Date(m.sent_at).toLocaleTimeString() : "";
    return `<div class="msg ${local ? "local" : "remote"}" style="--c:${c}">
      <div class="lam" title="marca de Lamport">L${m.lamport}</div>
      <div>
        <span class="who" style="color:${local ? "inherit" : c}">${esc(m.from)}</span>${tag}
        <span class="meta"> · ${time} · ${m.via}</span>
        <div class="body">${esc(m.body)}</div>
      </div></div>`;
  }).join("");
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

async function refresh() {
  try {
    const [st, msgs] = await Promise.all([api("/api/status"), api("/api/messages")]);
    myServer = st.server;
    $("srv").textContent = `servidor ${st.server}`;
    document.title = `#general · ${st.server}`;
    $("central").textContent = st.central_up ? "central activo" : "central caído";
    $("central").className = "pill " + (st.central_up ? "up" : "down");
    $("lamport").textContent = `lamport ${st.lamport}`;
    $("outbox").textContent = `pendientes ${st.outbox_pending}`;
    render(msgs);
  } catch (e) {
    $("central").textContent = "servidor local no responde";
    $("central").className = "pill down";
  }
}

$("enter").onclick = login;
$("user").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("composer").addEventListener("submit", send);
showMe();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
